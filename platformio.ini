[env:esp32-s2]
platform = espressif32@6.12.0
board = esp32-s2-saola-1
framework = arduino
lib_deps = 
    blynkkk/Blynk @ ^1.3.2
monitor_speed = 115200
upload_speed = 921600
upload_protocol = esptool
build_flags = 
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
